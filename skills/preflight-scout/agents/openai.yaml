interface:
  display_name: "Preflight Scout"
  short_description: "Run focused PR checks and collect release evidence"
  default_prompt: "Use $preflight-scout to inspect this repository's current diff. Run setup diagnostics, build and review the QA plan, execute browser checks within existing task authorization, and report what passed, failed, or remains untested with evidence paths."

policy:
  allow_implicit_invocation: true
